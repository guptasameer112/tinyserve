[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyserve"
version = "0.0.1"
description = "A small vLLM-style inference engine built from scratch."
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["tinyserve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
