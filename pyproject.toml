[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyserve"
version = "0.0.1"
description = "A small vLLM-style inference engine built from scratch."
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
server = ["fastapi>=0.100", "uvicorn>=0.23", "httpx>=0.24"]

[tool.setuptools.packages.find]
include = ["tinyserve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real model weights (run on Colab)"]
