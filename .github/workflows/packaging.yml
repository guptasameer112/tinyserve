name: Packaging CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Static sources, notebooks, links and result envelopes
        run: python scripts/check_static.py
      - name: Build distribution without installing model dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple build==1.3.0
          python -m build
          python scripts/check_static.py --wheel dist/*.whl --sdist dist/*.tar.gz
      - name: Install verified documentation tools
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tinyserve-doc-tools"
          mkdir -p "$tools"
          curl --fail --location --retry 3 https://github.com/jgm/pandoc/releases/download/3.13/pandoc-3.13-linux-amd64.tar.gz -o "$tools/pandoc.tar.gz"
          curl --fail --location --retry 3 https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz -o "$tools/typst.tar.xz"
          echo "38aa33b325a2bc96a4c39409631212db55702f564250bcdbead180b3bf646389  $tools/pandoc.tar.gz" | sha256sum --check
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  $tools/typst.tar.xz" | sha256sum --check
          tar -xzf "$tools/pandoc.tar.gz" -C "$tools"
          tar -xJf "$tools/typst.tar.xz" -C "$tools"
          echo "$tools/pandoc-3.13/bin" >> "$GITHUB_PATH"
          echo "$tools/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Compile the complete study guide
        run: python scripts/build_guide.py --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tinyserve-packaging
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/tinyserve-study-guide.pdf
            dist/tinyserve-study-guide.manifest.json
          if-no-files-found: error
          retention-days: 30
